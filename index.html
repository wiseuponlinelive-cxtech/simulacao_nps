<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulação — NPS MLS Festival</title>
<style>
  :root{
    --wa-bg:#0b141a;
    --wa-header:#202c33;
    --wa-in:#202c33;
    --wa-out:#005c4b;
    --wa-text:#e9edef;
    --wa-text-dim:#8696a0;
    --wa-link:#53bdeb;
    --wa-divider:#2a3942;
    --wa-green:#00a884;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#d9dbd4;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .frame{
    width:100%;
    max-width:400px;
    background:var(--wa-bg);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
    display:flex;
    flex-direction:column;
    height:min(780px,calc(100vh - 48px));
  }
  .top{
    background:var(--wa-header);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .ava{
    width:38px;height:38px;border-radius:50%;
    background:var(--wa-green);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;font-weight:600;flex-shrink:0;
  }
  .who{color:var(--wa-text);font-size:15px;font-weight:500;line-height:1.3}
  .who small{display:block;color:var(--wa-text-dim);font-size:12px;font-weight:400;margin-top:1px}
  .thread{
    flex:1;
    overflow-y:auto;
    padding:16px 12px 8px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .msg{
    max-width:84%;
    padding:8px 11px 6px;
    border-radius:8px;
    font-size:14.2px;
    line-height:1.45;
    color:var(--wa-text);
    white-space:pre-line;
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .in{background:var(--wa-in);align-self:flex-start;border-top-left-radius:2px}
  .out{background:var(--wa-out);align-self:flex-end;border-top-right-radius:2px}
  .hr{font-size:10.5px;color:var(--wa-text-dim);text-align:right;margin-top:3px}
  .out .hr{color:rgba(233,237,239,.6)}
  .btns{
    border-top:1px solid rgba(134,150,160,.25);
    margin-top:7px;padding-top:5px;
    display:flex;flex-direction:column;gap:2px;
  }
  .btn{
    background:none;border:none;
    color:var(--wa-link);
    font-size:14px;font-family:inherit;
    padding:8px;border-radius:6px;cursor:pointer;
    width:100%;
    transition:background .12s;
  }
  .btn:hover{background:rgba(83,189,235,.1)}
  .btn:focus-visible{outline:2px solid var(--wa-link);outline-offset:-2px}
  .typing{
    align-self:flex-start;background:var(--wa-in);
    padding:11px 14px;border-radius:8px;border-top-left-radius:2px;
    display:flex;gap:4px;
  }
  .typing i{
    width:6px;height:6px;border-radius:50%;background:var(--wa-text-dim);
    animation:bob 1.1s infinite;
  }
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes bob{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .composer{
    background:var(--wa-header);
    padding:8px 12px;
    display:flex;gap:8px;align-items:center;
    flex-shrink:0;
    border-top:1px solid var(--wa-divider);
  }
  .composer input{
    flex:1;background:#2a3942;border:none;
    color:var(--wa-text);font-family:inherit;font-size:14px;
    padding:10px 14px;border-radius:20px;
  }
  .composer input::placeholder{color:var(--wa-text-dim)}
  .composer input:focus{outline:2px solid var(--wa-green);outline-offset:1px}
  .composer button{
    width:38px;height:38px;border-radius:50%;border:none;
    background:var(--wa-green);color:#0b141a;
    font-size:17px;cursor:pointer;flex-shrink:0;
  }
  .composer[hidden]{display:none}
  .bar{
    background:#182229;
    padding:9px 14px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-shrink:0;
  }
  .bar span{color:var(--wa-text-dim);font-size:12.5px}
  .restart{
    background:none;border:1px solid var(--wa-divider);
    color:var(--wa-text-dim);font-family:inherit;font-size:12.5px;
    padding:6px 12px;border-radius:14px;cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  .restart:hover{border-color:var(--wa-text-dim);color:var(--wa-text)}
  @media (prefers-reduced-motion:reduce){
    .msg{animation:none}
    .typing i{animation:none;opacity:.6}
  }
</style>
</head>
<body>

<div class="frame">
  <div class="top">
    <div class="ava">ML</div>
    <div class="who">Maria Luísa
      <small>MLS Festival</small>
    </div>
  </div>

  <div class="thread" id="thread" aria-live="polite"></div>

  <form class="composer" id="composer" hidden>
    <input id="campo" placeholder="Digite a sua resposta" autocomplete="off">
    <button type="submit" aria-label="Enviar">➤</button>
  </form>

  <div class="bar">
    <span id="status">Disparo pós-evento</span>
    <button class="restart" id="restart">Recomeçar</button>
  </div>
</div>

<script>
const thread = document.getElementById('thread');
const status = document.getElementById('status');
const composer = document.getElementById('composer');
const campo = document.getElementById('campo');
let t = 0;
let aoResponder = null;

function hora(min){
  const base = new Date();
  base.setHours(10, 12 + min, 0);
  return base.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function bolha(texto, lado, botoes){
  const d = document.createElement('div');
  d.className = 'msg ' + lado;
  const p = document.createElement('div');
  p.textContent = texto;
  d.appendChild(p);

  if(botoes){
    const box = document.createElement('div');
    box.className = 'btns';
    botoes.forEach(b=>{
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = b.label;
      btn.onclick = ()=>{ box.remove(); b.acao(); };
      box.appendChild(btn);
    });
    d.appendChild(box);
  }

  const h = document.createElement('div');
  h.className = 'hr';
  h.textContent = hora(t++);
  d.appendChild(h);

  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
}

function digitando(ms, depois){
  const d = document.createElement('div');
  d.className = 'typing';
  d.innerHTML = '<i></i><i></i><i></i>';
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
  setTimeout(()=>{ d.remove(); depois(); }, ms);
}

function esperarTexto(callback){
  composer.hidden = false;
  campo.focus();
  aoResponder = callback;
}

composer.onsubmit = e=>{
  e.preventDefault();
  const txt = campo.value.trim();
  if(!txt) return;
  campo.value = '';
  composer.hidden = true;
  bolha(txt,'out');
  const cb = aoResponder;
  aoResponder = null;
  if(cb) cb(txt);
};

/* ---------- 1. Disparo de NPS ---------- */

function disparo(){
  bolha(
    'Oi, Ana! Aqui é a Maria Luísa, do atendimento do MLS Festival.\n\nJá se passou um mês desde o nosso encontro e a sua opinião ajuda muito a MLS a construir as próximas edições.\n\nDe 0 a 10, que nota você dá para o MLS Festival 2026?',
    'in',
    [
      { label:'9 a 10', acao:()=>nota('9 a 10','promotor') },
      { label:'7 a 8',  acao:()=>nota('7 a 8','neutro') },
      { label:'0 a 6',  acao:()=>nota('0 a 6','detrator') }
    ]
  );
}

function nota(valor, faixa){
  bolha(valor,'out');
  status.textContent = 'Nota ' + valor + ' — ' + faixa;

  if(faixa === 'detrator'){
    digitando(1100, ()=>{
      bolha('Obrigada por compartilhar, Ana. Sinto muito que a experiência não tenha sido como você esperava.\n\nVou direcionar o seu atendimento para o time responsável, que vai te ouvir com calma por aqui mesmo.','in');
      status.textContent = 'Detrator — transbordo, sem oferta';
    });
    return;
  }

  digitando(900, ()=>{
    bolha(faixa === 'promotor'
      ? 'Que bom, Ana! Obrigada pela sua nota 🙌'
      : 'Obrigada pela sua nota, Ana! Anotado por aqui 🙌','in');

    digitando(1400, ()=>{
      bolha(
        'Aproveitando o nosso contato: a ATrinca, formada por Flávio Augusto, Joel Jota e Caio Carneiro, abriu candidaturas para a Formação de Mentores.\n\nÉ um programa para quem já tem experiência e quer transformar esse conhecimento em uma mentoria estruturada, com método, escala e recorrência.\n\nQuer conhecer os detalhes?',
        'in',
        [
          { label:'Quero conhecer', acao:detalhes },
          { label:'Agora não', acao:recusouOferta }
        ]
      );
    });
  });
}

/* ---------- 2. Detalhe da Formação ---------- */

function detalhes(){
  bolha('Quero conhecer','out');
  status.textContent = 'Interessado — recebendo detalhes';
  digitando(1500, ()=>{
    bolha(
      'A Formação é conduzida pelos três: Joel, Caio e Flávio.\n\nÉ composta por reuniões presenciais, plataforma com bastante conteúdo e muito mais.\n\nPara dar prosseguimento, vou te passar para a Márcia, acessora da Formação, que te perguntará algumas coisas para ver se fará sentido para você. Ela assumirá esta conversa a partir daqui.\n\nMuito obrigada pela atenção e tenha um excelente dia!',
      'in'
    );
    status.textContent = 'Passando para a Márcia (~1 min no real)';
    setTimeout(iniciarAplicacao, 3500);
  });
}

/* ---------- 3. Aplicação com a Márcia ---------- */

function iniciarAplicacao(){
  status.textContent = 'Transbordo para a caixa da Márcia';
  digitando(1600, ()=>{
    document.querySelector('.ava').textContent = 'M';
    document.querySelector('.who').childNodes[0].textContent = 'Márcia';
    document.querySelector('.who small').textContent = 'Formação de Mentores';
    bolha('Oi! Aqui é a Márcia, acessora da Formação de Mentores 😊\n\nA Maria Luísa me passou o seu contato e vou seguir com você a partir daqui. São algumas perguntas rápidas pra eu entender se a Formação faz sentido pra você.\n\nPra começar, me conta: qual é a sua profissão e em que área você atua hoje?','in');
    status.textContent = 'Aplicação — pergunta 1 de 4';
    esperarTexto(p2);
  });
}

function p2(){
  digitando(1100, ()=>{
    bolha('Entendi. E há quanto tempo você atua nessa área?','in');
    status.textContent = 'Aplicação — pergunta 2 de 4';
    esperarTexto(p3);
  });
}

function p3(){
  digitando(1100, ()=>{
    bolha('Certo. Qual foi o seu faturamento no ano passado?','in');
    status.textContent = 'Aplicação — pergunta 3 de 4';
    esperarTexto(p4);
  });
}

function p4(){
  digitando(1100, ()=>{
    bolha('O Flávio, o Joel e o Caio gostam de conhecer cada pessoa antes. Me conta um pouco da sua trajetória e do que você já construiu que teria valor pra ensinar numa mentoria?','in');
    status.textContent = 'Aplicação — pergunta 4 de 4';
    esperarTexto(fim);
  });
}

function fim(){
  digitando(1400, ()=>{
    bolha('Prontinho, Ana! Sua aplicação está registrada.\n\nEla passa agora por análise e, se for aprovada, um dos nossos líderes entra em contato com você por aqui.','in');
    status.textContent = 'Aplicação concluída ✓';
  });
}

/* ---------- Recusas ---------- */

function recusouOferta(){
  bolha('Agora não','out');
  status.textContent = 'Recusou a oferta — encerrado';
  digitando(800, ()=>{
    bolha('Sem problemas, Ana. Obrigada pela sua participação no MLS Festival!','in');
  });
}

document.getElementById('restart').onclick = ()=>{
  thread.innerHTML = '';
  composer.hidden = true;
  aoResponder = null;
  t = 0;
  document.querySelector('.ava').textContent = 'ML';
  document.querySelector('.who').childNodes[0].textContent = 'Maria Luísa';
  document.querySelector('.who small').textContent = 'MLS Festival';
  status.textContent = 'Disparo pós-evento';
  disparo();
};

disparo();
</script>

</body>
</html>
